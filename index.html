<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Coach — Elite Training</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e24b4a;--red-dark:#c03b3a;--red-glow:rgba(226,75,74,0.2);--bg:#080808;--surface:#111;--surface2:#181818;--surface3:#1f1f1f;--border:#242424;--border2:#2e2e2e;--text:#f5f5f5;--muted:#555;--muted2:#888;--gold:#c9a84c;--green:#5a9e2f;--font-display:'Barlow Condensed',sans-serif;--font-body:'DM Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

header{background:linear-gradient(90deg,#0d0d0d,#111);border-bottom:1px solid var(--border2);padding:0 20px;display:flex;align-items:center;gap:12px;height:56px;flex-shrink:0;position:relative;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.5;}
.logo{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:.03em;}
.logo span{color:var(--red);font-style:italic;}
.badge{font-size:9px;padding:3px 8px;border-radius:4px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}

.tab-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-shrink:0;}
.tab{flex:1;padding:12px 6px;font-size:11px;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-align:center;border-bottom:2px solid transparent;transition:all .2s;}
.tab.active{color:var(--red);border-bottom-color:var(--red);}

/* SHARED */
.view{flex:1;display:none;flex-direction:column;overflow:hidden;}
.view.active{display:flex;}

.search-bar{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;}
.search-bar input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:10px 14px 10px 38px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;}
.search-bar input:focus{border-color:var(--red);}
.search-bar input::placeholder{color:#444;}
.search-icon{position:absolute;left:27px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted);pointer-events:none;}

.scroll-area{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}

/* SECTION HEADERS */
.section-title{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin:8px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border2);}

/* PROGRAM CARDS */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px;}
.prog-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.prog-card:hover{border-color:rgba(226,75,74,.5);}
.prog-card-header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.prog-card-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.prog-card-title{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
.prog-card-sub{font-size:11px;color:var(--muted2);margin-top:1px;}
.prog-exercises{padding:8px 0;}
.prog-ex{display:flex;align-items:center;padding:7px 16px;gap:10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.prog-ex:last-child{border-bottom:none;}
.prog-ex:hover{background:rgba(226,75,74,.05);}
.prog-ex-num{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--red);width:18px;flex-shrink:0;}
.prog-ex-info{flex:1;}
.prog-ex-name{font-size:13px;font-weight:500;}
.prog-ex-detail{font-size:11px;color:var(--muted2);margin-top:1px;}
.prog-tag{font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(226,75,74,.12);color:var(--red);border:1px solid rgba(226,75,74,.25);font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}

/* RECOMMENDATION CARDS */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:24px;}
.rec-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.rec-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s;}
.rec-card:hover{border-color:rgba(226,75,74,.5);}
.rec-card:hover::before{opacity:1;}
.rec-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rec-card-icon{font-size:22px;}
.rec-card-name{font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;}
.rec-card-desc{font-size:12px;color:var(--muted2);line-height:1.6;margin-bottom:10px;}
.rec-tags{display:flex;flex-wrap:wrap;gap:5px;}
.rec-tag{font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border2);color:var(--muted2);}

/* DIET MEAL CARDS */
.meal-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:10px;padding:16px;margin-bottom:10px;}
.meal-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.meal-name{font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;}
.meal-cals{font-size:12px;color:var(--red);font-weight:600;}
.meal-desc{font-size:12px;color:var(--muted2);line-height:1.6;margin-bottom:10px;}
.macro-row{display:flex;gap:10px;}
.macro{text-align:center;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px 12px;flex:1;}
.macro-val{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--text);}
.macro-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

/* LIBRARY */
.lib-layout{flex:1;display:flex;overflow:hidden;}
.body-panel{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;padding:12px 10px;overflow-y:auto;}
.body-panel-title{font-family:var(--font-display);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.body-wrap{width:150px;height:270px;}
.body-svg{width:100%;height:100%;}
.view-btns{display:flex;gap:5px;margin-top:8px;}
.vbtn{padding:4px 14px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-size:11px;font-weight:700;font-family:var(--font-display);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.vbtn.active,.vbtn:hover{border-color:var(--red);color:var(--red);}
.sel-info{margin-top:10px;padding:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;width:100%;}
.sel-info-name{font-family:var(--font-display);font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px;}
.sel-info-muscles{font-size:10px;color:var(--muted2);line-height:1.5;}
.leg-title{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px;}
.leg-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted2);margin-bottom:3px;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.ex-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cat-bar{padding:7px 12px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;}
.ccat{font-size:10px;font-weight:700;padding:4px 10px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;transition:all .15s;}
.ccat:hover{border-color:var(--red);color:var(--text);}
.ccat.active{background:var(--red);border-color:var(--red);color:#fff;}
.ex-count{padding:5px 12px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;}
.ex-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
.ex-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:8px;padding:11px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.ex-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),transparent);opacity:0;transition:opacity .2s;}
.ex-card:hover,.ex-card.sel{border-color:var(--red);}
.ex-card:hover::before,.ex-card.sel::before{opacity:1;}
.ex-card.sel{background:linear-gradient(145deg,rgba(226,75,74,.07),var(--surface2));}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;margin-bottom:4px;}
.ex-name{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.2;}
.ex-badge{font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;font-family:var(--font-display);white-space:nowrap;flex-shrink:0;}
.ex-badge.compound{background:rgba(226,75,74,.15);color:var(--red);border:1px solid rgba(226,75,74,.3);}
.ex-badge.isolation{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.25);}
.ex-primary{font-size:10px;color:var(--muted2);margin-bottom:4px;}
.ex-primary strong{color:var(--text);font-weight:600;}
.ex-tags{display:flex;flex-wrap:wrap;gap:3px;}
.ex-tag{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid var(--border2);color:var(--muted2);background:var(--bg);}
.ex-tag.p{border-color:rgba(226,75,74,.35);color:var(--red);background:rgba(226,75,74,.06);}
.no-results{text-align:center;color:var(--muted);font-size:13px;padding:30px;grid-column:1/-1;}
.muscle-part{transition:fill .25s,filter .25s;cursor:pointer;}

/* DIET */
.restriction-bar{padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.rchip{font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;font-family:var(--font-body);transition:all .15s;}
.rchip:hover{border-color:var(--red);color:var(--text);}
.rchip.active{background:var(--red);border-color:var(--red);color:#fff;}
.diet-plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px;}
.diet-plan-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:12px;overflow:hidden;}
.diet-plan-header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.diet-plan-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.diet-plan-title{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
.diet-plan-sub{font-size:11px;color:var(--muted2);margin-top:1px;}
.meal-row{display:flex;align-items:flex-start;padding:10px 16px;gap:10px;border-bottom:1px solid var(--border);transition:background .15s;}
.meal-row:last-child{border-bottom:none;}
.meal-row:hover{background:rgba(226,75,74,.04);}
.meal-time{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--red);width:80px;flex-shrink:0;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.meal-info{flex:1;}
.meal-name-sm{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;}
.meal-desc-sm{font-size:11px;color:var(--muted2);line-height:1.5;margin-bottom:5px;}
.macro-pills{display:flex;gap:5px;flex-wrap:wrap;}
.mpill{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border2);color:var(--muted2);}
.mpill.p{border-color:rgba(226,75,74,.3);color:var(--red);}
.diet-rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px;}
.diet-rec-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;border-top:3px solid var(--red);}
.diet-rec-card:hover{border-color:rgba(226,75,74,.6);}
.drc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.drc-icon{font-size:20px;}
.drc-name{font-family:var(--font-display);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.drc-desc{font-size:12px;color:var(--muted2);line-height:1.5;margin-bottom:8px;}
.drc-tags{display:flex;flex-wrap:wrap;gap:4px;}
.drc-tag{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--border2);color:var(--muted2);}
</style>
</head>

</header>

var GOAL_COLORS = {muscle:'#e24b4a',strength:'#c9a84c',fat:'#5a9e2f',athletic:'#4a7ae2'};

function renderProgRecs() {
  var recs = PROGRAMS.filter(function(p){return p.recommended;});
  document.getElementById('prog-recs').innerHTML = recs.map(function(p){
    return '<div class="rec-card" onclick="scrollToProg(\''+p.id+'\')" style="border-top:3px solid '+GOAL_COLORS[p.goal]+';">'+
      '<div class="rec-card-top"><div class="rec-card-icon">'+p.icon+'</div><div class="rec-card-name">'+p.name+'</div></div>'+
      '<div class="rec-card-desc">'+p.description+'</div>'+
      '<div class="rec-tags">'+p.tags.map(function(t){return '<span class="rec-tag">'+t+'</span>';}).join('')+'</div>'+
    '</div>';
  }).join('');
}

function renderPrograms(list) {
  if (!list) list = PROGRAMS;
  document.getElementById('prog-grid').innerHTML = list.map(function(p){
    return '<div class="prog-card" id="prog-'+p.id+'">'+
      '<div class="prog-card-header" style="border-left:3px solid '+GOAL_COLORS[p.goal]+';">'+
        '<div class="prog-card-icon" style="background:'+GOAL_COLORS[p.goal]+'22;font-size:20px;">'+p.icon+'</div>'+
        '<div><div class="prog-card-title">'+p.name+'</div><div class="prog-card-sub">'+p.sub+' · '+p.days+' days/week</div></div>'+
      '</div>'+
      p.schedule.map(function(day, di){
        return '<div style="border-bottom:1px solid var(--border);padding:8px 16px;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);">Day '+(di+1)+': '+day.focus+'</div>'+
        '<div class="prog-exercises">'+
        day.exercises.map(function(ex,ei){
          return '<div class="prog-ex" onclick="jumpToEx(\''+ex.name+'\')">'+
            '<div class="prog-ex-num">'+(ei+1)+'</div>'+
            '<div class="prog-ex-info"><div class="prog-ex-name">'+ex.name+'</div><div class="prog-ex-detail">'+ex.sets+' sets × '+ex.reps+' · Rest '+ex.rest+'</div></div>'+
            '<div class="prog-tag">view →</div>'+
          '</div>';
        }).join('')+
        '</div>';
      }).join('')+
    '</div>';
  }).join('');
}

function scrollToProg(id) {
  var el = document.getElementById('prog-'+id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function jumpToEx(name) {
  showTab('library');
  document.getElementById('lib-search').value = name;
  libRender();
  setTimeout(function(){
    var card = document.querySelector('.ex-card');
    if (card) card.click();
  }, 150);
}

function progSearch() {
  var q = document.getElementById('prog-search').value.toLowerCase();
  if (!q) { renderPrograms(); document.getElementById('prog-programs-title').textContent = 'All Programs'; return; }
  var filtered = PROGRAMS.filter(function(p){
    return p.name.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q) || p.goal.includes(q) ||
      p.schedule.some(function(d){ return d.exercises.some(function(e){ return e.name.toLowerCase().includes(q); }); });
  });
  renderPrograms(filtered);
  document.getElementById('prog-programs-title').textContent = filtered.length + ' result' + (filtered.length !== 1 ? 's' : '');
}

var dietRestriction = 'all';

function setRestriction(el, r) {
  document.querySelectorAll('.rchip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  dietRestriction = r;
  renderDietRecs();
  renderDietPlans();
}

function renderDietRecs() {
  document.getElementById('diet-recs').innerHTML = DIET_RECS.map(function(d){
    return '<div class="diet-rec-card" onclick="jumpToDietPlan(''+d.target+'')" style="border-top-color:'+d.color+';">'+
      '<div class="drc-top"><div class="drc-icon">'+d.icon+'</div><div class="drc-name">'+d.name+'</div></div>'+
      '<div class="drc-desc">'+d.desc+'</div>'+
      '<div class="drc-tags">'+d.tags.map(function(t){ return '<span class="drc-tag">'+t+'</span>'; }).join('')+'</div>'+
    '</div>';
  }).join('');
}

function jumpToDietPlan(id) {
  var el = document.getElementById('diet-plan-'+id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderDietPlans(list) {
  var plans = list || DIET_PLANS;
  if (dietRestriction !== 'all') {
    plans = plans.filter(function(p){ return p.restrictions.indexOf(dietRestriction) > -1; });
  }
  var titleEl = document.getElementById('diet-plans-title');
  if (titleEl) titleEl.textContent = plans.length + ' Meal Plan' + (plans.length !== 1 ? 's' : '');
  document.getElementById('diet-plans').innerHTML = plans.map(function(p){
    return '<div class="diet-plan-card" id="diet-plan-'+p.id+'">'+
      '<div class="diet-plan-header" style="border-left:3px solid '+p.color+';">'+
        '<div class="diet-plan-icon" style="background:'+p.color+'22;">'+p.icon+'</div>'+
        '<div><div class="diet-plan-title">'+p.name+'</div><div class="diet-plan-sub">'+p.sub+'</div></div>'+
      '</div>'+
      p.meals.map(function(m){
        return '<div class="meal-row">'+
          '<div class="meal-time">'+m.time+'</div>'+
          '<div class="meal-info">'+
            '<div class="meal-name-sm">'+m.name+' <span style="color:var(--muted);font-size:11px;">· '+m.cals+' cal</span></div>'+
            '<div class="meal-desc-sm">'+m.desc+'</div>'+
            '<div class="macro-pills">'+
              '<span class="mpill p">'+m.protein+' protein</span>'+
              '<span class="mpill">'+m.carbs+' carbs</span>'+
              '<span class="mpill">'+m.fat+' fat</span>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>';
  }).join('');
}

function dietSearch() {
  var q = document.getElementById('diet-search').value.toLowerCase();
  if (!q) { renderDietRecs(); renderDietPlans(); return; }
  var filteredPlans = DIET_PLANS.filter(function(p){
    return p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.tags.some(function(t){ return t.toLowerCase().includes(q); }) ||
      p.meals.some(function(m){ return m.name.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q); });
  });
  renderDietPlans(filteredPlans);
}

var libCat = 'all', libSel = null, libView = 'front', libInit = false, libMuscleFilter = null;

function setView(v) {
  libView = v;
  document.getElementById('svg-front').style.display = v === 'front' ? 'block' : 'none';
  document.getElementById('svg-back').style.display = v === 'back' ? 'block' : 'none';
  document.getElementById('vbtn-front').classList.toggle('active', v === 'front');
  document.getElementById('vbtn-back').classList.toggle('active', v === 'back');
  if (libSel) highlightEx(libSel);
}

function clearHL() {
  document.querySelectorAll('.muscle-part').forEach(function(el){ el.style.fill=''; el.style.filter=''; });
}

function highlightIds(ids, color, filter) {
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if (el) { el.style.fill = color; el.style.filter = filter; }
  });
}

function highlightEx(ex) {
  clearHL();
  var pm = ex.muscles[0].toLowerCase();
  var sm = ex.muscles.slice(1).map(function(m){ return m.toLowerCase(); });
  highlightIds(MUSCLE_MAP[pm] || [], '#e24b4a', 'drop-shadow(0 0 6px #e24b4a99)');
  sm.forEach(function(m){ highlightIds((MUSCLE_MAP[m]||[]).filter(function(id){ return !document.getElementById(id)||document.getElementById(id).style.fill!=='#e24b4a'; }), '#c9a84c', 'drop-shadow(0 0 4px #c9a84c77)'); });

  // highlight all same-onclick siblings
  document.querySelectorAll('.muscle-part').forEach(function(el){
    var oc = el.getAttribute('onclick')||'';
    var match = oc.match(/'([^']+)'/);
    if (match) {
      var mkey = match[1];
      var ids = MUSCLE_MAP[mkey]||[];
      var pids = MUSCLE_MAP[pm]||[];
      if (ids.some(function(id){ return pids.indexOf(id) > -1; }) && !el.style.fill) {
        el.style.fill = '#e24b4a'; el.style.filter = 'drop-shadow(0 0 6px #e24b4a99)';
      }
      sm.forEach(function(m){
        var sids = MUSCLE_MAP[m]||[];
        if (ids.some(function(id){ return sids.indexOf(id) > -1; }) && !el.style.fill) {
          el.style.fill = '#c9a84c'; el.style.filter = 'drop-shadow(0 0 4px #c9a84c77)';
        }
      });
    }
  });

  document.getElementById('sel-info').innerHTML = '<div class="sel-info-name">'+ex.name+'</div><div class="sel-info-muscles"><span style="color:var(--red)">●</span> '+ex.muscles[0]+(ex.muscles.length>1?'<br><span style="color:var(--gold)">●</span> '+ex.muscles.slice(1).join(', '):'')+'</div>';

  var backMuscles = ['lats','rhomboids','traps','erectors','rear-delts','glutes','hamstrings','calves'];
  var hasBack = ex.muscles.some(function(m){ return backMuscles.some(function(b){ return m.toLowerCase().includes(b); }); });
  var hasFront = ex.muscles.some(function(m){ var k=m.toLowerCase(); return !backMuscles.every(function(b){ return !k.includes(b); }) ? false : true; });
  if (hasBack && ex.muscles.length < 3) setView('back'); else setView('front');
}

function clickMuscle(mkey) {
  libMuscleFilter = libMuscleFilter === mkey ? null : mkey;
  if (libMuscleFilter) {
    clearHL();
    document.querySelectorAll('.muscle-part').forEach(function(el){
      var oc = el.getAttribute('onclick')||'';
      if (oc.includes("'"+mkey+"'")) { el.style.fill='#e24b4a'; el.style.filter='drop-shadow(0 0 6px #e24b4a99)'; }
    });
    document.getElementById('sel-info').innerHTML = '<div class="sel-info-name">'+mkey.replace(/-/g,' ').toUpperCase()+'</div><div class="sel-info-muscles">Filtering exercises for this muscle</div>';
  } else {
    clearHL();
    document.getElementById('sel-info').innerHTML = '<div style="font-size:10px;color:var(--muted);">Click a muscle or exercise</div>';
  }
  libRender();
}

function setCat(el, c) {
  document.querySelectorAll('.ccat').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active'); libCat = c; libMuscleFilter = null; clearHL();
  document.getElementById('sel-info').innerHTML = '<div style="font-size:10px;color:var(--muted);">Click a muscle or exercise</div>';
  libRender();
}

function libRender() {
  var q = (document.getElementById('lib-search')||{value:''}).value.toLowerCase();
  var filtered = EXERCISES.map(function(ex,i){ return Object.assign({},ex,{idx:i}); }).filter(function(ex){
    var matchCat = libCat==='all' || ex.category===libCat;
    var matchQ = !q || ex.name.toLowerCase().includes(q) || ex.muscles.some(function(m){ return m.toLowerCase().includes(q); }) || ex.primary.toLowerCase().includes(q) || ex.category.includes(q);
    var matchMuscle = !libMuscleFilter || ex.muscles.some(function(m){
      var mk = m.toLowerCase();
      var mapped = MUSCLE_MAP[libMuscleFilter]||[];
      return mk.includes(libMuscleFilter) || mapped.some(function(id){ return mk.includes(id.replace('f-','').replace('b-','')); });
    });
    return matchCat && matchQ && matchMuscle;
  });
  var countEl = document.getElementById('lib-count');
  if (countEl) countEl.textContent = filtered.length + ' exercise' + (filtered.length!==1?'s':'') + (libMuscleFilter?' for '+libMuscleFilter.replace(/-/g,' '):'');
  var grid = document.getElementById('lib-grid');
  if (!grid) return;
  if (!filtered.length) { grid.innerHTML = '<div class="no-results">No exercises found.</div>'; return; }
  grid.innerHTML = filtered.map(function(ex){
    return '<div class="ex-card'+(libSel&&libSel.name===ex.name?' sel':'')+'" data-idx="'+ex.idx+'" onclick="selectEx('+ex.idx+')">'+
      '<div class="ex-top"><div class="ex-name">'+ex.name+'</div><div class="ex-badge '+ex.type+'">'+ex.type+'</div></div>'+
      '<div class="ex-primary">Target: <strong>'+ex.primary+'</strong></div>'+
      '<div class="ex-tags">'+ex.muscles.map(function(m,i){ return '<span class="ex-tag'+(i===0?' p':'')+'">'+ m+'</span>'; }).join('')+'</div>'+
    '</div>';
  }).join('');
}

function selectEx(idx) {
  libSel = EXERCISES[idx];
  document.querySelectorAll('.ex-card').forEach(function(c){ c.classList.toggle('sel', parseInt(c.dataset.idx)===idx); });
  highlightEx(libSel);
  libMuscleFilter = null;
}
